<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Nexora Business Solutions</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #f8fafc;
            background: radial-gradient(circle at top, #172554, #020617 65%);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border: 1px solid #334155;
            border-radius: 20px;
            background: #0f172a;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.15);
        }

        h1 {
            margin-top: 0;
            font-size: 27px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #475569;
            border-radius: 9px;
            color: white;
            background: #020617;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            color: #082f49;
            background: #38bdf8;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7dd3fc;
        }

        .error {
            padding: 12px;
            border: 1px solid #f87171;
            border-radius: 8px;
            color: #fecaca;
            background: #450a0a;
        }

        .footer {
            margin-bottom: 0;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Nexora Admin</h1>
        <p>Sign in to manage customer enquiries and quotation requests.</p>

        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <label for="username">Admin username</label>
            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
                maxlength="100"
            >

            <label for="password">Admin password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                maxlength="256"
            >

            <button type="submit">Sign In Securely</button>
        </form>

        <p class="footer">Nexora Business Solutions · Admin Access</p>
    </main>
</body>
</html>
